<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>やじるし ぱずる</title>
<style>
  :root{
    --bg:#fff8e7; --panel:#ffffff; --ink:#3b2f2f; --grid:#e9f7e1; --line:#b9dfa8;
    --mae:#4aa3ff; --migi:#ff8a3d; --hidari:#a66bff; --kuri:#2fbf71; --ng:#ff5c6c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","BIZ UDPGothic","Meiryo",sans-serif;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px 16px 24px;}
  header{width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  h1{font-size:22px; margin:4px 0;}
  .pill{background:var(--panel); border-radius:999px; padding:6px 14px; font-weight:bold; box-shadow:0 2px 0 #0001;}
  .iconbtn{border:none; background:var(--panel); border-radius:50%; width:48px; height:48px; font-size:24px; box-shadow:0 3px 0 #0002; cursor:pointer;}
  #msg{width:100%; max-width:560px; margin:8px 0; background:var(--panel); border-radius:16px; padding:10px 14px;
    font-size:20px; font-weight:bold; text-align:center; min-height:52px; box-shadow:0 2px 0 #0001;}
  /* board */
  #board{--n:5; width:min(92vw,420px); aspect-ratio:1; display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr);
    gap:4px; background:var(--line); padding:4px; border-radius:16px; position:relative;}
  
  .cell{min-width:0; min-height:0; overflow:hidden; background:var(--grid); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:min(9vw,42px);}
  .cell.path{background:#fff3b0;}
  #hero{position:absolute; width:calc((100% - 8px - 16px)/5); aspect-ratio:1; left:0; top:0;
    transition:transform .35s ease; pointer-events:none; display:flex; align-items:center; justify-content:center;}
  #heroBody{width:86%; height:86%; display:flex; align-items:center; justify-content:center; transition:transform .3s ease;}
  #hero.bump #heroBody{animation:bump .4s;}
  #hero.joy #heroBody{animation:joy .6s 2;}
  @keyframes bump{0%,100%{translate:0 0}30%{translate:-6px 0}60%{translate:6px 0}}
  @keyframes joy{0%,100%{scale:1}50%{scale:1.25}}
  /* program */
  .label{width:100%; max-width:560px; font-weight:bold; margin:14px 0 6px; font-size:18px;}
  #program{width:100%; max-width:560px; min-height:84px; background:var(--panel); border-radius:16px; padding:8px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; border:3px dashed #e0d3b8;}
  #program .empty{color:#b5a78c; font-size:18px; padding:0 6px;}
  #palette{width:100%; max-width:560px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .card{border:none; border-radius:14px; color:#fff; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #0003;
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:inherit;}
  .card:active{transform:translateY(3px); box-shadow:0 1px 0 #0003;}
  #palette .card{height:88px; font-size:15px; white-space:nowrap;}
  #palette .card .ico{font-size:34px; line-height:1;}
  #program .card{width:62px; height:62px; font-size:12px;}
  #program .card .ico{font-size:26px; line-height:1;}
  #program .card.now{outline:4px solid #ffd23f; outline-offset:2px;}
  .mae{background:var(--mae);} .migi{background:var(--migi);} .hidari{background:var(--hidari);} .kuri{background:var(--kuri);}
  .count{font-size:11px; opacity:.9;}
  #controls{width:100%; max-width:560px; display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:14px;}
  .big{border:none; border-radius:16px; height:64px; font-size:20px; white-space:nowrap; font-weight:bold; font-family:inherit; cursor:pointer; box-shadow:0 4px 0 #0003;}
  .big:active{transform:translateY(3px); box-shadow:0 1px 0 #0003;}
  .big:disabled{opacity:.5;}
  #run{background:#ff5c8a; color:#fff;} #clear{background:#fff; color:var(--ink);}
  #left{font-size:15px; color:#8a7a5c; margin-top:6px; width:100%; max-width:560px; text-align:right;}
  /* overlay */
  #overlay{position:fixed; inset:0; background:#0006; display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  #overlay.show{display:flex;}
  #ovBox{background:#fff; border-radius:24px; padding:24px; text-align:center; max-width:360px; width:100%;}
  #ovBox .face{font-size:72px;}
  #ovBox p{font-size:24px; font-weight:bold; margin:8px 0 18px;}
  #ovBox button{width:100%; background:#2fbf71; color:#fff;}
  /* そだてる */
  #home{position:fixed; inset:0; background:#0006; display:none; align-items:center; justify-content:center; padding:16px; z-index:20;}
  #home.show{display:flex;}
  #homeBox{background:#fff8e7; border-radius:24px; padding:20px; text-align:center; max-width:380px; width:100%;}
  #homeName{font-size:24px; font-weight:bold; margin:0;}
  #homeLv{font-size:16px; color:#8a7a5c; margin:4px 0;}
  #homeChar{width:180px; height:180px; margin:8px auto; display:flex; align-items:center; justify-content:center;}
  #homeChar svg{transition:width .5s, height .5s;}
  #homeChar.eat svg{animation:joy .4s 2;}
  #bar{height:16px; background:#eee3c9; border-radius:999px; overflow:hidden; margin:6px 0 12px;}
  #barIn{height:100%; width:0; background:#2fbf71; transition:width .4s;}
  #basket{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:56px; background:#fff; border-radius:16px; padding:8px; margin-bottom:12px;}
  .fruit{border:none; background:#fff3b0; border-radius:12px; width:52px; height:52px; font-size:30px; cursor:pointer; box-shadow:0 3px 0 #0002;}
  .fruit:active{transform:translateY(2px); box-shadow:none;}
  #basket .empty{color:#b5a78c; font-size:16px; align-self:center;}
  #homeClose{width:100%; background:#ff5c8a; color:#fff;}
  #fruitBtn{display:flex; align-items:center; gap:4px; border:none; background:var(--panel); border-radius:999px; padding:6px 12px;
    font-size:18px; font-weight:bold; font-family:inherit; box-shadow:0 3px 0 #0002; cursor:pointer; color:var(--ink);}
  #fruitBtn.pop{animation:joy .5s 2;}
  #ovFruit{font-size:26px; font-weight:bold; margin:-6px 0 16px;}
</style>
</head>
<body>
<header>
  <span class="pill" id="stageLabel">もんだい 1/3</span>
  <button id="fruitBtn" aria-label="そだてる">🏠 <span id="fruitCount">0</span>こ</button>
  <button class="iconbtn" id="sound" aria-label="おと">🔊</button>
</header>

<div id="msg"></div>

<div id="board"><div id="hero"><div id="heroBody"></div></div></div>

<div class="label">ならべた かーど（さわると けせるよ）</div>
<div id="program"></div>
<div id="left"></div>

<div class="label">かーどを えらんでね</div>
<div id="palette">
  <button class="card mae" data-t="mae"><span class="ico">⬆️</span>まえ</button>
  <button class="card migi" data-t="migi"><span class="ico">↪️</span>みぎ</button>
  <button class="card hidari" data-t="hidari"><span class="ico">↩️</span>ひだり</button>
  <button class="card kuri" data-t="kuri"><span class="ico">🔁</span>くりかえし</button>
</div>

<div id="controls">
  <button class="big" id="clear">ぜんぶ けす</button>
  <button class="big" id="run">▶ うごかす</button>
</div>

<div id="overlay"><div id="ovBox">
  <div class="face" id="ovFace">🎉</div>
  <p id="ovText">できたね！</p>
  <div id="ovFruit"></div>
  <button class="big" id="ovBtn">つぎへ</button>
</div></div>

<div id="home"><div id="homeBox">
  <p id="homeName"></p>
  <p id="homeLv"></p>
  <div id="homeChar"></div>
  <div id="bar"><div id="barIn"></div></div>
  <div id="basket"></div>
  <button class="big" id="homeClose">ぱずるに もどる</button>
</div></div>

<script>
// ===== すてーじ =====
// dir: 0=うえ 1=みぎ 2=した 3=ひだり / r=ぎょう(うえから) c=れつ(ひだりから)
const STAGES = [
  { start:{r:4,c:2,dir:0}, goal:{r:1,c:2}, rocks:[], max:6,
    hint:"まえ を つかって ほしまで いこう" },
  { start:{r:4,c:1,dir:0}, goal:{r:2,c:3}, rocks:[[1,1],[0,1]], max:8,
    hint:"とちゅうで みぎ に まがろう" },
  { start:{r:4,c:0,dir:1}, goal:{r:0,c:4}, rocks:[[2,2],[1,1],[3,3]], max:6,
    hint:"かーどは 6まいまで。くりかえし を つかってみよう" },
];
// ===== そだてる =====
const FRUITS = ["🍎","🍌","🍇","🍓","🍑","🍊"];
// xp = たべた くだものの かず。この かずに なると せいちょう
const LEVELS = [
  {xp:0, name:"ちびぴよ",   size:0.70},
  {xp:2, name:"ぴよ",       size:0.82},
  {xp:5, name:"おおぴよ",   size:0.92},
  {xp:9, name:"きんぐぴよ", size:1.00},
];
const SAVE_KEY = "yajirushi-puzzle-v1";
let save = {xp:0, basket:[]};
try{ const v = JSON.parse(localStorage.getItem(SAVE_KEY)); if(v && Array.isArray(v.basket)) save = v; }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function levelOf(xp){ let l=0; LEVELS.forEach((L,i)=>{ if(xp>=L.xp) l=i; }); return l; }

// きゃら の え（うえ を むいた むき）。れべるで みためが かわる
function charSVG(lv){
  const pct = Math.round(LEVELS[lv].size*100);
  return `<svg viewBox="0 0 100 100" style="width:${pct}%;height:${pct}%;overflow:visible">
  ${lv>=2 ? `<ellipse cx="12" cy="60" rx="10" ry="18" fill="#ffc400" stroke="#e0a800" stroke-width="3"/>
             <ellipse cx="88" cy="60" rx="10" ry="18" fill="#ffc400" stroke="#e0a800" stroke-width="3"/>` : ""}
  <circle cx="50" cy="56" r="38" fill="#ffd23f" stroke="#e0a800" stroke-width="4"/>
  ${lv>=1 && lv<3 ? `<path d="M26 28 q-14 -6 -10 -18 q12 2 10 18z" fill="#2fbf71" stroke="#1e9a58" stroke-width="2"/>` : ""}
  ${lv>=3 ? `<polygon points="30,26 34,8 42,20 50,4 58,20 66,8 70,26" fill="#ffcf33" stroke="#d99a00" stroke-width="3" stroke-linejoin="round"/>
             <circle cx="50" cy="12" r="3" fill="#ff5c6c"/>` : ""}
  <polygon points="50,2 64,22 36,22" fill="#ff8a3d" stroke="#e0701f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="36" cy="46" r="6" fill="#3b2f2f"/><circle cx="64" cy="46" r="6" fill="#3b2f2f"/>
  <circle cx="38" cy="44" r="2" fill="#fff"/><circle cx="66" cy="44" r="2" fill="#fff"/>
  <ellipse cx="26" cy="62" rx="7" ry="4" fill="#ff9aa2"/><ellipse cx="74" cy="62" rx="7" ry="4" fill="#ff9aa2"/>
  <path d="M40 66 Q50 76 60 66" stroke="#3b2f2f" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;
}
function refreshChar(){
  const lv = levelOf(save.xp);
  $("heroBody").innerHTML = charSVG(lv);
  $("fruitCount").textContent = save.basket.length;
}
function renderHome(){
  const lv = levelOf(save.xp), L = LEVELS[lv], next = LEVELS[lv+1];
  $("homeName").textContent = L.name;
  $("homeLv").textContent = next ? `あと ${next.xp - save.xp}こ たべると おおきくなるよ` : "いちばん おおきく なったよ！";
  $("homeChar").innerHTML = charSVG(lv);
  $("barIn").style.width = next ? `${(save.xp - L.xp)/(next.xp - L.xp)*100}%` : "100%";
  const b = $("basket"); b.innerHTML = "";
  if(save.basket.length===0) b.innerHTML = '<span class="empty">もんだいを とくと くだものが もらえるよ</span>';
  save.basket.forEach((f,i) => {
    const btn = document.createElement("button");
    btn.className = "fruit"; btn.textContent = f;
    btn.onclick = () => feed(i);
    b.appendChild(btn);
  });
}
function feed(i){
  const before = levelOf(save.xp);
  save.basket.splice(i,1); save.xp++; persist();
  const after = levelOf(save.xp);
  renderHome(); refreshChar();
  const c = $("homeChar"); c.classList.remove("eat"); c.offsetHeight; c.classList.add("eat");
  say(after > before ? `やったー！ ${LEVELS[after].name} に せいちょう したよ！` : "もぐもぐ。おいしい！");
}
function openHome(){
  if(running) return;
  renderHome(); $("home").classList.add("show");
  const lv = levelOf(save.xp);
  say(save.basket.length ? `${LEVELS[lv].name} に くだものを あげよう。さわってね` : `${LEVELS[lv].name} だよ。もんだいを とくと くだものが もらえるよ`);
}
function giveFruit(){
  const f = FRUITS[Math.floor(Math.random()*FRUITS.length)];
  save.basket.push(f); persist(); refreshChar();
  const b = $("fruitBtn"); b.classList.remove("pop"); b.offsetHeight; b.classList.add("pop");
  return f;
}

const NAMES = {mae:"まえ", migi:"みぎ", hidari:"ひだり", kuri:"くりかえし"};
const ICONS = {mae:"⬆️", migi:"↪️", hidari:"↩️", kuri:"🔁"};
const DR = [-1,0,1,0], DC = [0,1,0,-1];
const N = 5, STEP_MS = 550;

let stageIdx = 0, program = [], running = false, hero = {}, soundOn = true;
const $ = id => document.getElementById(id);

// ===== よみあげ =====
function say(text){
  if(!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = 0.9; u.pitch = 1.2;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function show(text, speak=true){ $("msg").textContent = text; if(speak) say(text); }

// ===== ばん =====
function buildBoard(){
  const s = STAGES[stageIdx];
  const board = $("board");
  board.querySelectorAll(".cell").forEach(e => e.remove());
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const d = document.createElement("div");
    d.className = "cell"; d.id = `cell-${r}-${c}`;
    if(s.goal.r===r && s.goal.c===c) d.textContent = "⭐";
    if(s.rocks.some(([rr,cc]) => rr===r && cc===c)) d.textContent = "🪨";
    board.insertBefore(d, $("hero"));
  }
  $("stageLabel").textContent = `もんだい ${stageIdx+1}/${STAGES.length}`;
  resetHero();
}
function resetHero(){
  const s = STAGES[stageIdx];
  hero = {r:s.start.r, c:s.start.c, dir:s.start.dir, turns:s.start.dir};
  document.querySelectorAll(".cell.path").forEach(e => e.classList.remove("path"));
  placeHero(false);
}
function placeHero(animate=true){
  const h = $("hero"), body = $("heroBody");
  if(!animate){ h.style.transition = "none"; body.style.transition = "none"; }
  // 4px ぱでぃんぐ + 4px ぎゃっぷ
  h.style.transform = `translate(calc(4px + ${hero.c} * (100% + 4px)), calc(4px + ${hero.r} * (100% + 4px)))`;
  body.style.transform = `rotate(${hero.turns*90}deg)`;
  if(!animate){ h.offsetHeight; h.style.transition = ""; body.style.transition = ""; }
}

// ===== ぷろぐらむ =====
function renderProgram(activeIdx=-1){
  const p = $("program"); p.innerHTML = "";
  if(program.length===0){
    p.innerHTML = '<span class="empty">ここに かーどが ならぶよ</span>';
  }
  program.forEach((card,i) => {
    const b = document.createElement("button");
    b.className = `card ${card.t}` + (i===activeIdx ? " now" : "");
    b.innerHTML = `<span class="ico">${ICONS[card.t]}</span>${card.t==="kuri" ? `<span class="count">${card.n}かい</span>` : NAMES[card.t]}`;
    b.onclick = () => {
      if(running) return;
      program.splice(i,1); renderProgram(); say("けしたよ");
    };
    p.appendChild(b);
  });
  const max = STAGES[stageIdx].max;
  $("left").textContent = `あと ${max - program.length}まい おけるよ`;
}
function addCard(t){
  if(running) return;
  const max = STAGES[stageIdx].max;
  if(program.length >= max){ show(`かーどは ${max}まいまでだよ`); return; }
  if(t==="kuri"){
    // くりかえしを つづけて おすと かいすうが ふえる
    const last = program[program.length-1];
    if(last && last.t==="kuri"){ last.n = last.n>=5 ? 2 : last.n+1; renderProgram(); say(`${last.n}かい`); return; }
    program.push({t, n:2}); renderProgram();
    say("くりかえし 2かい。もういちど おすと かずが ふえるよ。つぎの かーどを くりかえすよ");
    return;
  }
  program.push({t}); renderProgram(); say(NAMES[t]);
}

// くりかえし(n) + つぎの かーど → そのかーどを n かい
function expand(){
  const steps = [];
  for(let i=0;i<program.length;i++){
    const c = program[i];
    if(c.t==="kuri"){
      const next = program[i+1];
      if(!next || next.t==="kuri") continue;
      for(let k=0;k<c.n;k++) steps.push({t:next.t, src:[i,i+1]});
      i++;
    } else steps.push({t:c.t, src:[i]});
  }
  return steps;
}

const wait = ms => new Promise(r => setTimeout(r, ms));
async function run(){
  if(running) return;
  if(program.length===0){ show("かーどを ならべてね"); return; }
  running = true; $("run").disabled = $("clear").disabled = true;
  resetHero(); await wait(250);
  const s = STAGES[stageIdx];
  const steps = expand();
  let fail = null;
  for(const st of steps){
    renderProgram(st.src[st.src.length-1]);
    if(st.t==="migi"){ hero.dir=(hero.dir+1)%4; hero.turns++; }
    else if(st.t==="hidari"){ hero.dir=(hero.dir+3)%4; hero.turns--; }
    else {
      const nr = hero.r + DR[hero.dir], nc = hero.c + DC[hero.dir];
      if(nr<0||nr>=N||nc<0||nc>=N){ fail="そとには でられないよ"; }
      else if(s.rocks.some(([r,c]) => r===nr && c===nc)){ fail="いわに ぶつかっちゃった"; }
      if(fail){ bump(); break; }
      $(`cell-${hero.r}-${hero.c}`).classList.add("path");
      hero.r = nr; hero.c = nc;
    }
    placeHero();
    await wait(STEP_MS);
    if(hero.r===s.goal.r && hero.c===s.goal.c) break;
  }
  renderProgram();
  running = false; $("run").disabled = $("clear").disabled = false;
  if(hero.r===s.goal.r && hero.c===s.goal.c){ win(); return; }
  show((fail || "ほしまで とどかなかったね") + "。もういちど やってみよう");
  await wait(1800); if(!running) resetHero();
}
function bump(){ const h=$("hero"); h.classList.remove("bump"); h.offsetHeight; h.classList.add("bump"); }
function win(){
  const h=$("hero"); h.classList.remove("joy"); h.offsetHeight; h.classList.add("joy");
  const last = stageIdx === STAGES.length-1;
  $("ovFace").textContent = last ? "🏆" : "🎉";
  $("ovText").textContent = last ? "ぜんぶ できたね！すごい！" : "できたね！やったね！";
  $("ovBtn").textContent = last ? "さいしょから" : "つぎへ";
  const f = giveFruit();
  $("ovFruit").textContent = `${f} を もらったよ！`;
  setTimeout(() => { $("overlay").classList.add("show"); say($("ovText").textContent + "。くだものを もらったよ。おうちで あげてね"); }, 700);
}
function loadStage(i){
  stageIdx = i; program = [];
  buildBoard(); renderProgram();
  show(`もんだい ${i+1}。${STAGES[i].hint}`);
}

// ===== いべんと =====
document.querySelectorAll("#palette .card").forEach(b => b.onclick = () => addCard(b.dataset.t));
$("run").onclick = run;
$("clear").onclick = () => { if(running) return; program=[]; renderProgram(); resetHero(); say("ぜんぶ けしたよ"); };
$("ovBtn").onclick = () => {
  $("overlay").classList.remove("show");
  loadStage(stageIdx === STAGES.length-1 ? 0 : stageIdx+1);
};
$("sound").onclick = () => {
  soundOn = !soundOn; $("sound").textContent = soundOn ? "🔊" : "🔇";
  if(!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  else say("おとを だすよ");
};
$("fruitBtn").onclick = openHome;
$("homeClose").onclick = () => { $("home").classList.remove("show"); say("がんばろう"); };
$("msg").onclick = () => say($("msg").textContent); // もういちど きく
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

refreshChar();
loadStage(0);
</script>
</body>
</html>
