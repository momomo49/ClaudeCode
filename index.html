<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>やじるし ぱずる</title>
<style>
  :root{
    --bg:#fff8e7; --panel:#ffffff; --ink:#3b2f2f; --sub:#8a7a5c; --grid:#e9f7e1; --line:#b9dfa8;
    --mae:#4aa3ff; --migi:#ff8a3d; --hidari:#a66bff; --kuri:#2fbf71; --pink:#ff5c8a; --hint:#ffb703;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","BIZ UDPGothic","Meiryo",sans-serif;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px 16px 32px;}
  button{font-family:inherit; color:inherit;}
  .wrap{width:100%; max-width:560px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .pill{background:var(--panel); border-radius:999px; padding:6px 14px; font-weight:bold; box-shadow:0 2px 0 #0001; font-size:15px;}
  .iconbtn{border:none; background:var(--panel); border-radius:50%; width:46px; height:46px; font-size:22px; box-shadow:0 3px 0 #0002; cursor:pointer; flex:none;}
  #fruitBtn{display:flex; align-items:center; gap:4px; border:none; background:#fff3b0; border-radius:999px; padding:6px 12px;
    font-size:17px; font-weight:bold; box-shadow:0 3px 0 #0002; cursor:pointer;}
  #fruitBtn.pop, #fruitBtn.has{animation:joy .9s infinite;}
  #msg{margin:10px 0; background:var(--panel); border-radius:16px; padding:10px 14px;
    font-size:19px; font-weight:bold; text-align:center; min-height:50px; box-shadow:0 2px 0 #0001; cursor:pointer;}
  .big{border:none; border-radius:16px; height:62px; font-size:20px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #0003; white-space:nowrap;}
  .big:active{transform:translateY(3px); box-shadow:0 1px 0 #0003;}
  .big:disabled{opacity:.5;}
  @keyframes bump{0%,100%{translate:0 0}30%{translate:-6px 0}60%{translate:6px 0}}
  @keyframes joy{0%,100%{scale:1}50%{scale:1.15}}

  /* ===== めにゅー ===== */
  #menu h1{text-align:center; font-size:30px; margin:16px 0 4px;}
  #menuChar{width:130px; height:130px; margin:0 auto; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #menuName{text-align:center; color:var(--sub); font-weight:bold; margin-bottom:12px;}
  .course{width:100%; display:flex; align-items:center; gap:12px; border:none; border-radius:20px; padding:14px 16px; margin-bottom:12px;
    color:#fff; text-align:left; cursor:pointer; box-shadow:0 5px 0 #0003;}
  .course:active{transform:translateY(3px); box-shadow:0 2px 0 #0003;}
  .course .ic{font-size:40px;}
  .course .nm{font-size:24px; font-weight:bold;}
  .course .ds{font-size:14px; opacity:.95;}
  .course .ct{margin-left:auto; font-size:18px; font-weight:bold; background:#fff4; border-radius:12px; padding:4px 10px;}
  .c-easy{background:#2fbf71;} .c-normal{background:#4aa3ff;} .c-hard{background:#a66bff;}
  #stageGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
  .sbtn{border:none; border-radius:16px; height:76px; font-size:26px; font-weight:bold; background:#fff; box-shadow:0 4px 0 #0002; cursor:pointer; position:relative;}
  .sbtn .mk{position:absolute; right:6px; top:4px; font-size:16px;}
  .sbtn.done{background:#fff3b0;}
  .sbtn:disabled{opacity:.45;}
  #courseTitle{font-size:24px; font-weight:bold; text-align:center; margin:12px 0 0;}

  /* ===== ばん ===== */
  #board{width:min(92vw,420px); aspect-ratio:1; display:grid; gap:4px; background:var(--line); padding:4px; border-radius:16px; position:relative; margin:0 auto;}
  .cell{min-width:0; min-height:0; overflow:hidden; background:var(--grid); border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative;}
  .cell.path{background:#fff3b0;}
  .cell .foot{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.6em; opacity:.85; animation:joy 1s infinite;}
  #hero{position:absolute; left:0; top:0; transition:transform .35s ease; pointer-events:none; display:flex; align-items:center; justify-content:center; z-index:2;}
  #heroBody{width:90%; height:90%; display:flex; align-items:center; justify-content:center; transition:transform .3s ease;}
  #heroBody img{object-fit:contain; pointer-events:none; max-width:none;}

  /* えの きゃら は まわさず、やじるしで むきを みせる */
  #heroArrow{position:absolute; inset:-18%; transition:transform .3s ease; pointer-events:none; display:none;}
  #heroArrow.show{display:block;}
  #heroArrow::before{content:""; position:absolute; left:50%; top:0; transform:translateX(-50%);
    border-left:13px solid transparent; border-right:13px solid transparent; border-bottom:16px solid #ff5c8a;
    filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);}
  #hero.bump #heroBody{animation:bump .4s;}
  #hero.joy #heroBody{animation:joy .6s 2;}

  /* ===== かーど ===== */
  .label{font-weight:bold; margin:14px 0 6px; font-size:17px;}
  #program{min-height:84px; background:var(--panel); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border:3px dashed #e0d3b8;}
  #program .empty{color:#b5a78c; font-size:17px; padding:0 6px;}
  #left{font-size:15px; color:var(--sub); margin-top:6px; text-align:right;}
  #palette{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  #palette.three{grid-template-columns:repeat(3,1fr);}
  .card{border:none; border-radius:14px; color:#fff !important; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #0003;
    display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .card:active{transform:translateY(3px); box-shadow:0 1px 0 #0003;}
  #palette .card{height:86px; font-size:15px; white-space:nowrap;}
  #palette .card .ico{font-size:32px; line-height:1;}
  #program .card, #hintCards .card{width:60px; height:60px; font-size:12px;}
  #program .card .ico, #hintCards .card .ico{font-size:24px; line-height:1;}
  #program .card.now{outline:4px solid #ffd23f; outline-offset:2px;}
  .mae{background:var(--mae);} .migi{background:var(--migi);} .hidari{background:var(--hidari);} .kuri{background:var(--kuri);}
  .count{font-size:11px;}
  #controls{display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:14px;}
  #run{background:var(--pink); color:#fff;} #clear{background:#fff;}
  #hintBtn{display:none; width:100%; margin-top:10px; background:var(--hint); color:#fff;}
  #hintBtn.show{display:block; animation:joy 1.2s infinite;}
  #hintBox{display:none; margin-top:10px; background:#fff7dd; border:3px solid var(--hint); border-radius:16px; padding:10px;}
  #hintBox.show{display:block;}
  #hintBox p{margin:0 0 8px; font-weight:bold;}
  #hintCards{display:flex; flex-wrap:wrap; gap:8px;}

  /* ===== おーばーれい ===== */
  .ov{position:fixed; inset:0; background:#0006; display:none; align-items:center; justify-content:center; padding:16px; z-index:20;}
  .ov.show{display:flex;}
  .ovBox{background:#fff8e7; border-radius:24px; padding:22px; text-align:center; max-width:380px; width:100%;}
  #ovFace{font-size:68px;}
  #ovText{font-size:24px; font-weight:bold; margin:6px 0;}
  #ovFruit{font-size:22px; font-weight:bold; margin:4px 0 14px; min-height:28px;}
  .ovBtns{display:grid; gap:10px;}
  #ovFeed{background:#ffb703; color:#fff;} #ovNext{background:#2fbf71; color:#fff;}
  #homeName{font-size:24px; font-weight:bold; margin:0;}
  #homeLv{font-size:15px; color:var(--sub); margin:4px 0;}
  #homeChar{width:190px; height:190px; margin:6px auto; display:flex; align-items:center; justify-content:center;}
  #homeChar.eat svg{animation:joy .4s 2;}
  #bar{height:16px; background:#eee3c9; border-radius:999px; overflow:hidden; margin:6px 0 12px;}
  #barIn{height:100%; width:0; background:#2fbf71; transition:width .4s;}
  #basket{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:56px; background:#fff; border-radius:16px; padding:8px; margin-bottom:12px; max-height:180px; overflow:auto;}
  .fruit{border:none; background:#fff3b0; border-radius:12px; width:50px; height:50px; font-size:28px; cursor:pointer; box-shadow:0 3px 0 #0002;}
  .fruit:active{transform:translateY(2px); box-shadow:none;}
  #basket .empty{color:#b5a78c; font-size:15px; align-self:center;}
  #homeClose{width:100%; background:var(--pink); color:#fff;}
  #charPick{display:flex; justify-content:center; gap:8px; margin:-4px 0 14px;}
  .cpick{border:3px solid transparent; background:#fff; border-radius:16px; width:min(62px,17vw); height:min(62px,17vw); padding:4px; cursor:pointer; box-shadow:0 3px 0 #0002;}
  .cpick.on{border-color:var(--pink);}
  .cpick svg, .cpick img{width:100%; height:100%; object-fit:contain;}
  #resetBtn{display:block; margin:28px auto 0; border:none; background:none; color:var(--sub); font-size:14px; text-decoration:underline; cursor:pointer;}
  #resetOk{background:#ff5c6c; color:#fff;} #resetNo{background:#fff;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<!-- ========== めにゅー ========== -->
<div id="menu" class="wrap">
  <header>
    <span></span>
    <button class="iconbtn sound" aria-label="おと">🔊</button>
  </header>
  <h1>やじるし ぱずる</h1>
  <div id="menuChar" aria-label="おうち"></div>
  <div id="menuName"></div>
  <div id="charPick"></div>
  <div id="courseList"></div>
  <button id="resetBtn">さいしょから やりなおす</button>
  <div id="stagePick" class="hidden">
    <div id="courseTitle"></div>
    <div id="stageGrid"></div>
    <button class="big" id="backCourse" style="width:100%;margin-top:16px;background:#fff;">← こーすを えらびなおす</button>

</div>

<!-- ========== げーむ ========== -->
<div id="game" class="wrap hidden">
  <header>
    <button class="iconbtn" id="toMenu" aria-label="もどる">↩</button>
    <span class="pill" id="stageLabel"></span>
    <button id="fruitBtn" aria-label="そだてる">🏠 <span id="fruitCount">0</span></button>
    <button class="iconbtn sound" aria-label="おと">🔊</button>
  </header>
  <div id="msg"></div>
  <div id="board"><div id="hero"><div id="heroArrow"></div><div id="heroBody"></div></div></div>

  <div class="label">ならべた かーど（さわると けせるよ）</div>
  <div id="program"></div>
  <div id="left"></div>

  <button class="big" id="hintBtn">💡 ひんとを みる</button>
  <div id="hintBox"><p id="hintText"></p><div id="hintCards"></div></div>

  <div class="label">かーどを えらんでね</div>
  <div id="palette">
    <button class="card mae" data-t="mae"><span class="ico">⬆️</span>まえ</button>
    <button class="card migi" data-t="migi"><span class="ico">↪️</span>みぎ</button>
    <button class="card hidari" data-t="hidari"><span class="ico">↩️</span>ひだり</button>
    <button class="card kuri" data-t="kuri"><span class="ico">🔁</span>くりかえし</button>
  </div>

    <button class="big" id="clear">ぜんぶ けす</button>
    <button class="big" id="run">▶ うごかす</button>
  </div>
</div>

<!-- ========== くりあ ========== -->
<div id="overlay" class="ov"><div class="ovBox">
  <div id="ovFace">🎉</div>
  <div id="ovText"></div>
  <div id="ovFruit"></div>
  <div class="ovBtns">
    <button class="big" id="ovFeed">🏠 ごはんを あげる</button>
    <button class="big" id="ovNext">つぎへ</button>
  </div>
</div></div>

<!-- ========== りせっと かくにん ========== -->
<div id="resetOv" class="ov"><div class="ovBox">
  <div style="font-size:56px">⚠️</div>
  <div id="ovText2" style="font-size:20px;font-weight:bold;margin:8px 0 16px">ほんとうに さいしょから やりなおす？<br><span style="font-size:15px;color:var(--sub)">といた もんだい・くだもの・そだち が ぜんぶ きえるよ</span></div>
  <div class="ovBtns">
    <button class="big" id="resetNo">やめる</button>
    <button class="big" id="resetOk">けして さいしょから</button>
  </div>
</div></div>

<!-- ========== おうち（そだてる） ========== -->
<div id="home" class="ov"><div class="ovBox">
  <p id="homeName"></p>
  <p id="homeLv"></p>
  <div id="homeChar"></div>
  <div id="bar"><div id="barIn"></div></div>
  <div id="basket"></div>
  <button class="big" id="homeClose">もどる</button>
</div></div>

<script>
// =====================================================================
//  もんだい（ちず）
//  . みち / # いわ / G ほし(ごーる) / F くだもの(ぜんぶ とってから ごーる)
//  ^ > v <  すたーと と さいしょの むき
//  max は じどうけいさん（さいたんの かーどの かず ＋ よゆう）
// =====================================================================
const COURSES = [
  { id:"easy", name:"かんたん", icon:"🐣", desc:"まえ・みぎ・ひだり を おぼえよう", cls:"c-easy",
    useKuri:false, slack:2, stages:[
    { hint:"まえ を つかって ほしまで いこう", map:[
      ".....",
      "..G..",
      ".....",
      "..^..",
      "....."]},
    { hint:"ぴよは みぎを むいてるよ", map:[
      ".....",
      ".....",
      ">...G",
      ".....",
      "....."]},
    { hint:"とちゅうで みぎ に まがろう", map:[
      ".....",
      "...G.",
      ".....",
      ".....",
      ".^..."]},
    { hint:"こんどは ひだり に まがろう", map:[
      ".....",
      ".G...",
      ".....",
      ".....",
      "...^."]},
    { hint:"ぴよは したを むいてるよ。ぴよの まえは どっちかな", map:[
      "..v..",
      ".....",
      ".....",
      "..G..",
      "....."]},
    { hint:"いわを よけて いこう", map:[
      ".....",
      "..G..",
      "..#..",
      ".....",
      "..^.."]},
    { hint:"くだもの を とってから ほしへ いこう", map:[
      ".....",
      ".F.G.",
      ".....",
      ".....",
      ".^..."]},
    { hint:"2かい まがるよ", map:[
      "G....",
      ".###.",
      ".....",
      ".....",
      "....^"]},
  ]},
  { id:"normal", name:"ふつう", icon:"🐥", desc:"くりかえし を つかおう", cls:"c-normal",
    useKuri:true, slack:1, stages:[
    { hint:"まえ を なんかいも おすのは たいへん。くりかえし を つかおう", map:[
      "......",
      "......",
      "......",
      "......",
      "......",
      ">....G"]},
    { hint:"くりかえし を 2かい つかうよ", map:[
      ".....G",
      "......",
      "......",
      "......",
      "......",
      "^....."]},
    { hint:"ぴよは したを むいてるよ。ひだり を むくと どっちかな", map:[
      "v.....",
      "......",
      "......",
      "......",
      "......",
      ".....G"]},
    { hint:"くだもの を とってから ほしへ", map:[
      "F....G",
      "......",
      "......",
      "......",
      "......",
      "^....."]},
    { hint:"ぴよは ひだりを むいてるよ", map:[
      "G.....",
      "#####.",
      "......",
      "......",
      "......",
      ".....<"]},
    { hint:"いわの かべの むこうに ほしが あるよ", map:[
      "......",
      "..#...",
      "..#...",
      "..#...",
      "..#...",
      ".^#.G."]},
    { hint:"くだもの 2こ を あつめよう", map:[
      ".....G",
      "......",
      ".....F",
      "......",
      "......",
      "^....F"]},
    { hint:"ぐるっと ゆーたーん", map:[
      "......",
      ".#....",
      ".#....",
      ".#....",
      ".#....",
      "^#G..."]},
  ]},
  { id:"hard", name:"むずかしい", icon:"🐔", desc:"かーどの かずが ぎりぎり！", cls:"c-hard",
    useKuri:true, slack:0, stages:[
    { hint:"かーどは 3まいだけ！ぴよの むきを よく みて", map:[
      "v....G",
      "......",
      "......",
      "......",
      "......",
      "......"]},
    { hint:"いわが じゃまだよ。まがる ところを かんがえよう", map:[
      ".....G",
      "#####.",
      "......",
      "......",
      "......",
      "^#...."]},
    { hint:"くだもの を とったら うしろを むこう", map:[
      "......",
      "......",
      ">.G..F",
      "......",
      "......",
      "......"]},
    { hint:"ひだりむきから すたーと。ぐるっと まわろう", map:[
      ".....<",
      ".#####",
      ".....G",
      "......",
      "......",
      "......"]},
    { hint:"くだもの 2こ。どっちから とる？", map:[
      "F....F",
      "......",
      "..##..",
      "..##..",
      "......",
      "^....G"]},
    { hint:"かべの むこうへ。くだものも わすれずに", map:[
      "F.....",
      "..#...",
      "..#...",
      "..#...",
      "..#...",
      ".^#.G."]},
    { hint:"めいろ だよ。ゆっくり かんがえよう", map:[
      "G.#...",
      ".##.#.",
      "....#.",
      "##.##.",
      "...#..",
      "^#...#"]},
    { hint:"さいごの もんだい！くだもの 3こ", map:[
      "F...#G",
      ".##.#.",
      ".#..#.",
      ".#.##.",
      ".#....",
      "^...F."]},
  ]},
];

// ===== ちずを よみこむ =====
function parseStage(s){
  const n = s.map.length; let start=null, goal=null; const rocks=new Set(), fruits=[];
  s.map.forEach((row,r) => [...row].forEach((ch,c) => {
    const d = "^>v<".indexOf(ch);
    if(d>=0) start={r,c,dir:d};
    else if(ch==="G") goal={r,c};
    else if(ch==="#") rocks.add(r*n+c);
    else if(ch==="F") fruits.push({r,c});
  }));
  return {n, start, goal, rocks, fruits};
}

// ===== いちばん すくない かーどの こたえを さがす =====
// じょうたい = ばしょ・むき・とった くだもの。かーど 1まい = こすと1（くりかえし＋まえ は 2）
const DR=[-1,0,1,0], DC=[0,1,0,-1];
function solve(P, useKuri){
  const fIdx = new Map(P.fruits.map((f,i)=>[f.r*P.n+f.c, i]));
  const full = (1<<P.fruits.length)-1;
  const key = (r,c,d,m) => ((r*P.n+c)*4+d)*16+m;
  const startM = 0;
  const dist = new Map(), prev = new Map();
  const k0 = key(P.start.r,P.start.c,P.start.dir,startM);
  dist.set(k0,0);
  let frontier = [[0,P.start.r,P.start.c,P.start.dir,startM]];
  let best = null;
  while(frontier.length){
    frontier.sort((a,b)=>a[0]-b[0]);
    const [cost,r,c,d,m] = frontier.shift();
    const k = key(r,c,d,m);
    if(dist.get(k) < cost) continue;
    if(r===P.goal.r && c===P.goal.c && m===full){ best=k; break; }
    const moves = [];
    moves.push({cards:[{t:"migi"}], cost:1, r, c, d:(d+1)%4, m, cells:[]});
    moves.push({cards:[{t:"hidari"}], cost:1, r, c, d:(d+3)%4, m, cells:[]});
    // まえ を k かい
    let rr=r, cc=c, mm=m; const cells=[];
    for(let step=1; step<=(useKuri?5:1); step++){
      rr+=DR[d]; cc+=DC[d];
      if(rr<0||rr>=P.n||cc<0||cc>=P.n||P.rocks.has(rr*P.n+cc)) break;
      const fi = fIdx.get(rr*P.n+cc); if(fi!==undefined) mm |= (1<<fi);
      cells.push([rr,cc]);
      const cards = step===1 ? [{t:"mae"}] : [{t:"kuri",n:step},{t:"mae"}];
      moves.push({cards, cost:cards.length, r:rr, c:cc, d, m:mm, cells:[...cells]});
      if(rr===P.goal.r && cc===P.goal.c && mm===full) break; // ごーるで とまる
    }
    for(const mv of moves){
      const nk = key(mv.r,mv.c,mv.d,mv.m), nc = cost+mv.cost;
      if(!dist.has(nk) || dist.get(nk) > nc){
        dist.set(nk,nc); prev.set(nk,{k, mv}); frontier.push([nc,mv.r,mv.c,mv.d,mv.m]);
      }
    }
  }
  if(best===null) return null;
  const cards=[], path=[[P.start.r,P.start.c]];
  const segs=[]; let k=best;
  while(k!==k0){ const p=prev.get(k); segs.unshift(p.mv); k=p.k; }
  segs.forEach(mv => { cards.push(...mv.cards); path.push(...mv.cells); });
  return {cards, path, count:cards.length};
}

// ===== せっていと せーぶ =====
// ===== きゃら =====
// img: "img/cat_" → img/cat_1.png 〜 img/cat_5.png（1024x1024 を 384 に しゅくしょう、はいけい とうめい）
const CHARS = [
  {id:"cat",  name:"にゃんこ", img:"img/cat_"},
  {id:"piyo", name:"ぴよ",     img:"img/chick_"},
  {id:"usa",  name:"うさぴょん", img:"img/rabbit_"},
  {id:"wan",  name:"わんこ",   img:"img/dog_"},
  {id:"pan",  name:"ぱんだ",   img:"img/panda_"},
];
const NAMES = {mae:"まえ", migi:"みぎ", hidari:"ひだり", kuri:"くりかえし"};
const ICONS = {mae:"⬆️", migi:"↪️", hidari:"↩️", kuri:"🔁"};
const FRUITS = ["🍎","🍌","🍇","🍓","🍑","🍊","🍒","🍈"];
const LEVELS = [
  {xp:0,  pre:"ちび"},
  {xp:3,  pre:""},
  {xp:8,  pre:"おお"},
  {xp:15, pre:"きんぐ"},
  {xp:24, pre:"にじいろ"},
];
const STEP_MS = 520;
const SAVE_KEY = "yajirushi-puzzle-v2";
let save = {xp:0, basket:[], cleared:{}, char:"cat"};
try{
  const v = JSON.parse(localStorage.getItem(SAVE_KEY));
  if(v && Array.isArray(v.basket)) save = Object.assign(save, v);
  else { // まえの ばーじょんの そだち を ひきつぐ
    const o = JSON.parse(localStorage.getItem("yajirushi-puzzle-v1"));
    if(o && Array.isArray(o.basket)){ save.xp=o.xp||0; save.basket=o.basket; }
  }
}catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function curChar(){ return CHARS.find(c=>c.id===save.char) || CHARS[0]; }
function lvName(lv){ return LEVELS[lv].pre + curChar().name; }
function charArt(lv, ch=curChar()){
  if(ch.svg) return charSVG(lv);
  const p = [80,86,92,96,100][lv];
  return `<img src="${ch.img}${lv+1}.png" alt="${LEVELS[lv].pre+ch.name}" style="width:${p}%;height:${p}%" draggable="false">`;
}
function levelOf(xp){ let l=0; LEVELS.forEach((L,i)=>{ if(xp>=L.xp) l=i; }); return l; }

let soundOn = true;
const $ = id => document.getElementById(id);
function say(text){
  if(!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; u.rate=0.9; u.pitch=1.2;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja"));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function show(text, speak=true){ $("msg").textContent=text; if(speak) say(text); }
const wait = ms => new Promise(r => setTimeout(r, ms));
function pulse(el, cls){ el.classList.remove(cls); el.offsetHeight; el.classList.add(cls); }

// ===== きゃら の え（うえ むき）=====
function charSVG(lv, sizePct=100){
  const s = [70,80,88,95,100][lv];
  const p = Math.round(s*sizePct/100);
  return `<svg viewBox="0 0 100 100" style="width:${p}%;height:${p}%;overflow:visible">
  ${lv>=4 ? `<circle cx="50" cy="56" r="49" fill="none" stroke="url(#rb)" stroke-width="6"/>
    <defs><linearGradient id="rb"><stop offset="0" stop-color="#ff5c6c"/><stop offset=".33" stop-color="#ffd23f"/><stop offset=".66" stop-color="#2fbf71"/><stop offset="1" stop-color="#4aa3ff"/></linearGradient></defs>` : ""}
  ${lv>=2 ? `<ellipse cx="12" cy="60" rx="10" ry="18" fill="#ffc400" stroke="#e0a800" stroke-width="3"/>
             <ellipse cx="88" cy="60" rx="10" ry="18" fill="#ffc400" stroke="#e0a800" stroke-width="3"/>` : ""}
  <circle cx="50" cy="56" r="38" fill="#ffd23f" stroke="#e0a800" stroke-width="4"/>
  ${lv>=1 && lv<3 ? `<path d="M26 28 q-14 -6 -10 -18 q12 2 10 18z" fill="#2fbf71" stroke="#1e9a58" stroke-width="2"/>` : ""}
  ${lv>=3 ? `<polygon points="30,26 34,8 42,20 50,4 58,20 66,8 70,26" fill="#ffcf33" stroke="#d99a00" stroke-width="3" stroke-linejoin="round"/>
             <circle cx="50" cy="12" r="3" fill="#ff5c6c"/>` : ""}
  <polygon points="50,2 64,22 36,22" fill="#ff8a3d" stroke="#e0701f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="36" cy="46" r="6" fill="#3b2f2f"/><circle cx="64" cy="46" r="6" fill="#3b2f2f"/>
  <circle cx="38" cy="44" r="2" fill="#fff"/><circle cx="66" cy="44" r="2" fill="#fff"/>
  <ellipse cx="26" cy="62" rx="7" ry="4" fill="#ff9aa2"/><ellipse cx="74" cy="62" rx="7" ry="4" fill="#ff9aa2"/>
  <path d="M40 66 Q50 76 60 66" stroke="#3b2f2f" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;
}
function refreshChar(){
  const lv = levelOf(save.xp);
  $("heroBody").innerHTML = charArt(lv);
  $("menuChar").innerHTML = charArt(lv);
  $("heroArrow").classList.toggle("show", !curChar().svg);
  if(P) placeHero(false);
  const cp = $("charPick"); cp.innerHTML = "";
  CHARS.forEach(ch => {
    const b = document.createElement("button");
    b.className = "cpick" + (ch.id===curChar().id ? " on" : "");
    b.innerHTML = charArt(lv, ch); b.setAttribute("aria-label", ch.name);
    b.onclick = () => { save.char = ch.id; persist(); refreshChar(); say(`${lvName(levelOf(save.xp))} に するよ`); };
    cp.appendChild(b);
  });
  $("menuName").textContent = `${lvName(lv)}` + (save.basket.length ? `　🧺${save.basket.length}こ` : "");
  $("fruitCount").textContent = save.basket.length;
  $("fruitBtn").classList.toggle("has", save.basket.length>0);
}

// ===== めにゅー =====
let course=null, stageIdx=0, P=null, SOL=null, maxCards=0;
function clearedCount(c){ return c.stages.filter((_,i)=>save.cleared[`${c.id}-${i}`]).length; }
function showMenu(){
  $("game").classList.add("hidden"); $("menu").classList.remove("hidden");
  $("stagePick").classList.add("hidden"); $("courseList").classList.remove("hidden"); $("resetBtn").classList.remove("hidden");
  const list = $("courseList"); list.innerHTML="";
  COURSES.forEach(c => {
    const b = document.createElement("button");
    b.className = `course ${c.cls}`;
    b.innerHTML = `<span class="ic">${c.icon}</span><span><div class="nm">${c.name}</div><div class="ds">${c.desc}</div></span>
      <span class="ct">${clearedCount(c)}/${c.stages.length}</span>`;
    b.onclick = () => showStages(c);
    list.appendChild(b);
  });
  refreshChar();
  show("こーすを えらんでね");
}
function showStages(c){
  course=c;
  $("courseList").classList.add("hidden"); $("stagePick").classList.remove("hidden"); $("resetBtn").classList.add("hidden");
  $("courseTitle").textContent = `${c.icon} ${c.name}`;
  const g = $("stageGrid"); g.innerHTML="";
  c.stages.forEach((_,i) => {
    const done = save.cleared[`${c.id}-${i}`];
    const open = i===0 || save.cleared[`${c.id}-${i-1}`] || done;
    const b = document.createElement("button");
    b.className = "sbtn" + (done ? " done" : "");
    b.innerHTML = `${i+1}<span class="mk">${done ? "⭐" : open ? "" : "🔒"}</span>`;
    b.disabled = !open;
    b.onclick = () => loadStage(c, i);
    g.appendChild(b);
  });
  say(`${c.name}。もんだいを えらんでね`);
}

// ===== ばん =====
let hero={}, program=[], running=false, got=new Set(), hintLv=0, fails=0;
function loadStage(c, i){
  course=c; stageIdx=i;
  P = parseStage(c.stages[i]);
  SOL = solve(P, c.useKuri);
  maxCards = SOL.count + c.slack;
  program=[]; hintLv=0; fails=0;
  $("menu").classList.add("hidden"); $("game").classList.remove("hidden");
  $("palette").querySelector(".kuri").classList.toggle("hidden", !c.useKuri);
  $("palette").classList.toggle("three", !c.useKuri);
  $("stageLabel").textContent = `${c.icon} ${c.name} ${i+1}/${c.stages.length}`;
  buildBoard(); renderProgram(); hideHint();
  show(`もんだい ${i+1}。${c.stages[i].hint.replaceAll("ぴよ", curChar().name)}`);
  window.scrollTo(0,0);
}
function buildBoard(){
  const b = $("board"), n=P.n;
  b.style.gridTemplateColumns = `repeat(${n},1fr)`;
  b.style.gridTemplateRows = `repeat(${n},1fr)`;
  b.querySelectorAll(".cell").forEach(e=>e.remove());
  const fs = n<=5 ? "min(9vw,42px)" : n===6 ? "min(7.5vw,36px)" : "min(6.5vw,30px)";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const d=document.createElement("div");
    d.className="cell"; d.id=`cell-${r}-${c}`; d.style.fontSize=fs;
    b.insertBefore(d, $("hero"));
  }
  const h=$("hero");
  h.style.width = h.style.height = `calc((100% - 8px - ${(n-1)*4}px) / ${n})`;
  resetBoard();
}
function resetBoard(){
  got = new Set();
  for(let r=0;r<P.n;r++) for(let c=0;c<P.n;c++){
    const d=$(`cell-${r}-${c}`); d.classList.remove("path");
    const foot = d.querySelector(".foot");
    d.textContent = P.rocks.has(r*P.n+c) ? "🪨" : (P.goal.r===r&&P.goal.c===c) ? "⭐" : "";
    if(foot) d.appendChild(foot);
  }
  P.fruits.forEach((f,i) => $(`cell-${f.r}-${f.c}`).prepend(document.createTextNode(FRUITS[i % FRUITS.length])));
  hero = {r:P.start.r, c:P.start.c, dir:P.start.dir, turns:P.start.dir};
  placeHero(false);
}
function placeHero(animate=true){
  const h=$("hero"), body=$("heroBody");
  if(!animate){ h.style.transition="none"; body.style.transition="none"; $("heroArrow").style.transition="none"; }
  h.style.transform = `translate(calc(4px + ${hero.c} * (100% + 4px)), calc(4px + ${hero.r} * (100% + 4px)))`;
  // ぴよ(え が うえむき) は まわす。えの きゃら は まわさず やじるし を まわす
  body.style.transform = curChar().svg ? `rotate(${hero.turns*90}deg)` : "none";
  $("heroArrow").style.transform = `rotate(${hero.turns*90}deg)`;
  if(!animate){ h.offsetHeight; h.style.transition=""; body.style.transition=""; $("heroArrow").style.transition=""; }
}

// ===== ぷろぐらむ =====
function cardHTML(card){
  return `<span class="ico">${ICONS[card.t]}</span>${card.t==="kuri" ? `<span class="count">${card.n}かい</span>` : NAMES[card.t]}`;
}
function renderProgram(activeIdx=-1){
  const p=$("program"); p.innerHTML="";
  if(program.length===0) p.innerHTML='<span class="empty">ここに かーどが ならぶよ</span>';
  program.forEach((card,i) => {
    const b=document.createElement("button");
    b.className=`card ${card.t}`+(i===activeIdx?" now":"");
    b.innerHTML=cardHTML(card);
    b.onclick=()=>{ if(running) return; program.splice(i,1); renderProgram(); say("けしたよ"); };
    p.appendChild(b);
  });
  $("left").textContent = `あと ${maxCards-program.length}まい おけるよ`;
}
function addCard(t){
  if(running) return;
  if(program.length>=maxCards){ show(`かーどは ${maxCards}まいまでだよ`); return; }
  if(t==="kuri"){
    const last=program[program.length-1];
    if(last && last.t==="kuri"){ last.n = last.n>=5 ? 2 : last.n+1; renderProgram(); say(`${last.n}かい`); return; }
    program.push({t,n:2}); renderProgram();
    say("くりかえし 2かい。もういちど おすと かずが ふえるよ。つぎの かーどを くりかえすよ");
    return;
  }
  program.push({t}); renderProgram(); say(NAMES[t]);
}
function expand(){
  const steps=[];
  for(let i=0;i<program.length;i++){
    const c=program[i];
    if(c.t==="kuri"){
      const next=program[i+1];
      if(!next || next.t==="kuri") continue;
      for(let k=0;k<c.n;k++) steps.push({t:next.t, at:i+1});
      i++;
    } else steps.push({t:c.t, at:i});
  }
  return steps;
}
const atGoalDone = () => hero.r===P.goal.r && hero.c===P.goal.c && got.size===P.fruits.length;

async function run(){
  if(running) return;
  if(program.length===0){ show("かーどを ならべてね"); return; }
  running=true; $("run").disabled=$("clear").disabled=true;
  resetBoard(); await wait(250);
  let fail=null;
  for(const st of expand()){
    renderProgram(st.at);
    if(st.t==="migi"){ hero.dir=(hero.dir+1)%4; hero.turns++; }
    else if(st.t==="hidari"){ hero.dir=(hero.dir+3)%4; hero.turns--; }
    else {
      const nr=hero.r+DR[hero.dir], nc=hero.c+DC[hero.dir];
      if(nr<0||nr>=P.n||nc<0||nc>=P.n) fail="そとには でられないよ";
      else if(P.rocks.has(nr*P.n+nc)) fail="いわに ぶつかっちゃった";
      if(fail){ pulse($("hero"),"bump"); break; }
      $(`cell-${hero.r}-${hero.c}`).classList.add("path");
      hero.r=nr; hero.c=nc;
      const fi = P.fruits.findIndex(f=>f.r===nr&&f.c===nc);
      if(fi>=0 && !got.has(fi)){
        got.add(fi);
        const cell=$(`cell-${nr}-${nc}`);
        if(cell.firstChild && cell.firstChild.nodeType===3) cell.firstChild.remove();
        say("ぱくっ");
      }
    }
    placeHero();
    await wait(STEP_MS);
    if(atGoalDone()) break;
  }
  renderProgram();
  running=false; $("run").disabled=$("clear").disabled=false;
  if(atGoalDone()){ win(); return; }
  if(!fail){
    fail = (hero.r===P.goal.r && hero.c===P.goal.c) ? "くだものを ぜんぶ とってから ほしに いこう" : "ほしまで とどかなかったね";
  }
  fails++;
  $("hintBtn").classList.add("show");
  show(`${fail}。おしい！こまったら ひんとを みてね`);
  await wait(1800); if(!running) resetBoard();
}

// ===== ひんと =====
// 1かいめ: あしあと（とおりみち）を ばんに だす
// 2かいめ: こたえの かーどを みせる
function hideHint(){
  $("hintBtn").classList.remove("show"); $("hintBox").classList.remove("show");
  document.querySelectorAll(".foot").forEach(e=>e.remove());
}
function showHint(){
  hintLv = Math.min(hintLv+1, 2);
  if(hintLv===1){
    document.querySelectorAll(".foot").forEach(e=>e.remove());
    SOL.path.slice(1).forEach(([r,c]) => {
      const cell=$(`cell-${r}-${c}`);
      if(cell.querySelector(".foot")) return;
      const f=document.createElement("span"); f.className="foot"; f.textContent="👣";
      cell.appendChild(f);
    });
    $("hintText").textContent = "👣 あしあとの ところを とおると いけるよ";
    $("hintCards").innerHTML = "";
    $("hintBox").classList.add("show");
    $("hintBtn").textContent = "💡 もっと ひんと（こたえ）";
    say(`あしあとの ところを とおると いけるよ。${curChar().name}の むきに きを つけてね`);
  } else {
    $("hintText").textContent = `こたえの れい（${SOL.count}まい）`;
    const hc=$("hintCards"); hc.innerHTML="";
    SOL.cards.forEach(card => {
      const d=document.createElement("div"); d.className=`card ${card.t}`; d.innerHTML=cardHTML(card); hc.appendChild(d);
    });
    $("hintBtn").classList.remove("show");
    say("こたえの れいだよ。おなじように ならべてみよう");
  }
  $("hintBox").scrollIntoView({behavior:"smooth", block:"nearest"});
}

// ===== くりあ と ごほうび =====
function win(){
  pulse($("hero"),"joy");
  const k=`${course.id}-${stageIdx}`, first=!save.cleared[k];
  const last = stageIdx===course.stages.length-1;
  let fruitMsg="", speech="";
  if(first){
    save.cleared[k]=true;
    const n = 1 + P.fruits.length; // ばんの くだもの も もらえる
    const got=[]; for(let i=0;i<n;i++){ const f=FRUITS[Math.floor(Math.random()*FRUITS.length)]; save.basket.push(f); got.push(f); }
    persist(); refreshChar(); pulse($("fruitBtn"),"pop");
    fruitMsg = `${got.join("")} を もらったよ！`;
    speech = `くだものを ${n}こ もらったよ。${curChar().name}に あげてね`;
  } else {
    fruitMsg = "（くだものは はじめて とけた ときだけ）";
  }
  $("ovFace").textContent = last ? "🏆" : "🎉";
  $("ovText").textContent = last ? `${course.name} ぜんぶ できたね！` : "できたね！やったね！";
  $("ovFruit").textContent = fruitMsg;
  $("ovFeed").classList.toggle("hidden", save.basket.length===0);
  $("ovNext").textContent = last ? "めにゅーへ" : "つぎの もんだい";
  hideHint();
  setTimeout(()=>{ $("overlay").classList.add("show"); say($("ovText").textContent + "。" + speech); }, 700);
}
function nextStage(){
  $("overlay").classList.remove("show");
  if(stageIdx===course.stages.length-1){ showMenu(); showStages(course); }
  else loadStage(course, stageIdx+1);
}

// ===== おうち =====
function renderHome(){
  const lv=levelOf(save.xp), L=LEVELS[lv], next=LEVELS[lv+1];
  $("homeName").textContent=lvName(lv);
  $("homeLv").textContent = next ? `あと ${next.xp-save.xp}こ たべると おおきくなるよ` : "いちばん すごい すがたに なったよ！";
  $("homeChar").innerHTML=charArt(lv);
  $("barIn").style.width = next ? `${(save.xp-L.xp)/(next.xp-L.xp)*100}%` : "100%";
  const b=$("basket"); b.innerHTML="";
  if(save.basket.length===0) b.innerHTML='<span class="empty">もんだいを とくと くだものが もらえるよ</span>';
  save.basket.forEach((f,i)=>{
    const btn=document.createElement("button"); btn.className="fruit"; btn.textContent=f;
    btn.onclick=()=>feed(i); b.appendChild(btn);
  });
}
function feed(i){
  const before=levelOf(save.xp);
  save.basket.splice(i,1); save.xp++; persist();
  const after=levelOf(save.xp);
  renderHome(); refreshChar(); pulse($("homeChar"),"eat");
  say(after>before ? `やったー！ ${lvName(after)} に せいちょう したよ！` : "もぐもぐ。おいしい！");
}
function openHome(){
  if(running) return;
  $("overlay").classList.remove("show");
  renderHome(); $("home").classList.add("show");
  const lv=levelOf(save.xp);
  say(save.basket.length ? `${lvName(lv)} に くだものを あげよう。さわってね` : `${lvName(lv)} だよ。もんだいを とくと くだものが もらえるよ`);
}
let homeFromWin=false;

// ===== いべんと =====
document.querySelectorAll("#palette .card").forEach(b => b.onclick=()=>addCard(b.dataset.t));
$("run").onclick=run;
$("clear").onclick=()=>{ if(running) return; program=[]; renderProgram(); resetBoard(); say("ぜんぶ けしたよ"); };
$("hintBtn").onclick=showHint;
$("ovNext").onclick=nextStage;
$("ovFeed").onclick=()=>{ homeFromWin=true; openHome(); };
$("homeClose").onclick=()=>{
  $("home").classList.remove("show");
  if(homeFromWin){ homeFromWin=false; nextStage(); }
};
$("fruitBtn").onclick=openHome;
$("menuChar").onclick=openHome;
$("toMenu").onclick=()=>{ if(running) return; showMenu(); if(course) showStages(course); };
$("backCourse").onclick=showMenu;
// しんちょく りせっと（えらんだ きゃら は のこす）
$("resetBtn").onclick=()=>{ $("resetOv").classList.add("show"); say("ほんとうに さいしょから やりなおす？"); };
$("resetNo").onclick=()=>{ $("resetOv").classList.remove("show"); };
$("resetOk").onclick=()=>{
  save = {xp:0, basket:[], cleared:{}, char:save.char};
  persist();
  $("resetOv").classList.remove("show");
  showMenu(); say("さいしょから やりなおすよ。がんばろう！");
};
document.querySelectorAll(".sound").forEach(b => b.onclick=()=>{
  soundOn=!soundOn;
  document.querySelectorAll(".sound").forEach(x=>x.textContent = soundOn ? "🔊" : "🔇");
  if(!soundOn && "speechSynthesis" in window) speechSynthesis.cancel(); else say("おとを だすよ");
});
$("msg").onclick=()=>say($("msg").textContent);

showMenu();
</script>
